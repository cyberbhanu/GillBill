services:
  - type: web
    name: gillbill
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm build:deploy
    startCommand: pnpm db:sync:deploy && pnpm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
